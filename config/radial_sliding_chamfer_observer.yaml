radial_sliding_chamfer_observer:
  ros__parameters:
    mode: validate
    free_space_validated: false

    sliding_frame: sliding_frame
    tcp_frame: tool0_controller
    publish_sliding_frame: true
    sliding_parent_frame: base
    sliding_tf_x_m: -0.22737
    sliding_tf_y_m: -0.40030
    sliding_tf_z_m: 0.03517
    sliding_tf_qx: -0.029727
    sliding_tf_qy: 0.047563
    sliding_tf_qz: -0.975264
    sliding_tf_qw: -0.213808

    start_x_m: 0.000
    start_y_m: -0.000
    start_z_m: 0.002

    start_qx: 0.049
    start_qy: 0.027
    start_qz: 0.281
    start_qw: 0.958

    start_joints_calibrated: true
    start_joints:
      - 1.4373391310321253
      - -1.1728220742991944
      - 0.8379926681518555
      - -1.8708659611144007
      - -1.5516975561725062
      - -0.21515161195863897

    # Trage hier deine bereits validierten Endgelenkwerte ein.
    slide_end_joints_calibrated: true
    slide_end_joints:
      - 1.4469035307513636
      - -1.179532842045166
      - 0.8049259781837463
      - -1.8731380901732386
      - -1.5505512396441858
      - -0.24823362032045537

    move_duration_s: 4.0
    slide_distance_m: 0.013
    radial_speed_mps: 0.001
    radial_tolerance_m: 0.001
    cross_axis_tolerance_m: 0.00075
    position_tolerance_m: 0.001
    orientation_tolerance_rad: 0.05236

    normal_force_n: -5.0
    contact_threshold_n: 2.0
    contact_persistence_s: 0.05
    contact_timeout_s: 3.0
    stabilisation_after_contact_s: 0.5
    speed_limit_z_mps: 0.005
    max_abs_normal_force_n: 12.0
    wrench_timeout_s: 0.25
    deviation_xy_m: 0.002
    deviation_z_m: 0.005
    deviation_angle_rad: 0.05
    damping_factor: 0.5
    gain_scaling: 0.3
    wrench_topic: /force_torque_sensor_broadcaster/wrench

    # Passive Fasenerkennung: kein Abbruch der Trajektorie.
    chamfer_detection_enabled: true
    chamfer_reference_window_s: 0.30
    chamfer_ignore_initial_s: 0.50
    chamfer_min_reference_samples: 10
    chamfer_force_drop_threshold_n: 1.50
    chamfer_position_drop_threshold_m: 0.00030
    chamfer_persistence_s: 0.05
    chamfer_detection_topic: /radial_sliding_chamfer_observer/chamfer_detection_state

    bag_root: /home/georgio/masterarbeit/bags
    bag_name: radial_sliding_chamfer_observation_01
    bag_start_wait_s: 2.0
    tare_wait_s: 1.0
