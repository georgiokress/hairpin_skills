phase_a_radial_ik_validator:
  ros__parameters:
    sliding_frame: sliding_frame
    tcp_frame: tool0_controller

    # Neue kontaktfreie Startpose für Setznest2
    # PolyScope Setznest2: z = -2 mm
    # ROS sliding_frame:   z = +2 mm
    start_x_m: 0.0
    start_y_m: 0.0
    start_z_m: 0.002

    start_qx: -0.002
    start_qy: 0.0
    start_qz: 0.962
    start_qw: -0.273

    # Vom Validator geforderte Controller-Reihenfolge:
    # elbow, shoulder_lift, shoulder_pan, wrist_1, wrist_2, wrist_3
    start_joints:
      - 0.7422645727740687
      - -0.9377638858607789
      - 0.9123795032501221
      - -1.3766160768321534
      - -1.5674694220172327
      - 0.1652015894651413

    move_to_start_duration_s: 4.0

    waypoint_yaml_file: /home/georgio/masterarbeit/radial_ik_waypoints_Setznest2.yaml

    # WP1 bis WP4 wurden am 2026-08-24 erfolgreich validiert;
    # abschließender kontaktfreier Test bis WP5 = 12.5 mm
    max_waypoint_index: 5
    radial_speed_mps: 0.001

    start_position_tolerance_m: 0.001
    start_orientation_tolerance_rad: 0.0523598776

    endpoint_radial_tolerance_m: 0.0005
    cross_axis_tolerance_m: 0.0005
    orientation_tolerance_rad: 0.0523598776
    monotonic_noise_tolerance_m: 0.00010

    # Online-Abbruchgrenzen
    abort_cross_axis_m: 0.0015
    abort_orientation_rad: 0.1047197551
    abort_radial_undershoot_m: 0.0005
    abort_radial_overshoot_m: 0.0010
    tf_timeout_s: 5.0
    sample_period_s: 0.02

    return_to_start_after_success: true
    pause_before_return_s: 0.5

    result_root: /home/georgio/masterarbeit/results/phase_a
    run_name: phase_a_Setznest2_ik_wp05

    record_bag: true
    bag_root: /home/georgio/masterarbeit/bags
    bag_start_wait_s: 1.5
