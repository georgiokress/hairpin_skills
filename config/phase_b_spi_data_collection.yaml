/**:
  ros__parameters:
    # Dedicated Phase B SPI acquisition route. This configuration preserves
    # the validated internal UR force-control architecture and 15 mm path.
    mode: slide
    free_space_validated: true

    sliding_frame: sliding_frame
    tcp_frame: tool0_controller
    publish_sliding_frame: false
    sliding_parent_frame: base
    # Documented fallback must match the validated Setznest2 static frame.
    # With publish_sliding_frame=false the existing runtime TF remains the
    # sole authority; the collector validates these values but does not
    # republish them.
    sliding_tf_x_m: -0.22768
    sliding_tf_y_m: -0.39961
    sliding_tf_z_m: 0.03753
    sliding_tf_qx: 0.002069
    sliding_tf_qy: 0.000319
    sliding_tf_qz: -0.970849
    sliding_tf_qw: -0.239684

    start_x_m: 0.0
    start_y_m: 0.0
    start_z_m: 0.002
    start_qx: -0.002
    start_qy: 0.0
    start_qz: 0.962
    start_qw: -0.273

    start_joints_calibrated: true
    start_joints:
      - 0.7422645727740687
      - -0.9377638858607789
      - 0.9123795032501221
      - -1.3766160768321534
      - -1.5674694220172327
      - 0.1652015894651413

    slide_end_joints_calibrated: true
    slide_end_joints:
      - 0.758388520463029
      - -0.9471567308767167
      - 0.8787480417076973
      - -1.3833276258813008
      - -1.5674274969876563
      - 0.13159239788256571

    move_duration_s: 4.0
    slide_distance_m: 0.015
    radial_speed_mps: 0.004
    radial_tolerance_m: 0.0005
    cross_axis_tolerance_m: 0.004
    position_tolerance_m: 0.001
    orientation_tolerance_rad: 0.05236

    # Internal UR force control. Positive model magnitude is 2 N; the ROS
    # force-mode command remains signed as -2 N.
    normal_force_n: -2.0
    contact_threshold_n: 0.5
    contact_persistence_s: 0.05
    contact_timeout_s: 5.0
    stabilisation_after_contact_s: 0.5
    speed_limit_z_mps: 0.001
    max_abs_normal_force_n: 6.0
    wrench_timeout_s: 0.25
    deviation_xy_m: 0.002
    deviation_z_m: 0.005
    deviation_angle_rad: 0.05
    damping_factor: 0.5
    gain_scaling: 0.3
    wrench_topic: /force_torque_sensor_broadcaster/wrench
    tare_service: /io_and_status_controller/zero_ftsensor
    tare_wait_s: 1.0
    post_tare_baseline_s: 1.0
    # Keep the geometric tolerance unchanged, but let TCP/TF feedback settle
    # after the return trajectory before the final start-pose validation.
    return_settle_s: 1.0
    # Reject an available but numerically stuck internal F/T stream before
    # any controller interaction or motion.
    internal_signal_check_duration_s: 2.0
    internal_signal_min_samples: 20
    internal_signal_min_peak_abs_n: 0.000001

    # ATI is recorded only as a passive reference and is never bridged to RTDE.
    ati_passive_topic: /ati/wrench_passive
    require_ati_passive_topic: true
    event_topic: /phase_b_spi_collection/events
    graph_validation_timeout_s: 5.0

    # Hard safety gates. This file is intentionally non-executable as a
    # physical experiment until both values are explicitly overridden for one
    # approved run. Dry-run performs configuration/ROS-graph checks only.
    collection_dry_run: true
    run_authorized: false

    # Qualification only: the manual reference parameterization is explicitly
    # not frozen yet.
    experiment_id: pb_spi_s4_setznest2_qualification_v1
    purpose: qualification
    repetition_index: 1
    batch_id: qualification_01
    planned_split: development
    planned_order_index: 1
    randomization_seed: -1
    manual_reference_frozen: false
    parameter_bounds_version: ""

    bag_root: /home/georgio/masterarbeit/bags/phase_b_spi/qualification
    bag_name: pb_spi_s4_setznest2_intctrl_atipass_d015_v0040_fn020_qualification_r001
    bag_start_wait_s: 3.0
    bag_qos_overrides_path: /home/georgio/hairpin_ws/src/hairpin_skills/config/rosbag_qos_overrides.yaml

    ground_truth_file: /home/georgio/masterarbeit/results/phase_b_spi/ground_truth/rgt_caliper_v1.json
    collection_config_path: /home/georgio/hairpin_ws/src/hairpin_skills/config/phase_b_spi_data_collection.yaml
    manifest_schema_path: /home/georgio/masterarbeit/config/phase_b_spi/run_manifest.schema.json
