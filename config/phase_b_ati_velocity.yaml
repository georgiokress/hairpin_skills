phase_b_ati_velocity:
  ros__parameters:
    phase_a_validated: true
    flat_surface_confirmed: true

    sliding_frame: sliding_frame
    tcp_frame: tool0_controller
    tf_timeout_s: 2.0
    # Genau eine Quelle: aktuell der laufende static_transform_publisher;
    # nach dem naechsten Bring-up wird er automatisch vom Launch gestartet.
    publish_sliding_frame: false
    sliding_parent_frame: base
    sliding_tf_x_m: -0.228
    sliding_tf_y_m: -0.400
    sliding_tf_z_m: 0.038
    sliding_tf_qx: -0.002
    sliding_tf_qy: 0.0
    sliding_tf_qz: 0.971
    sliding_tf_qw: 0.240

    start_x_m: 0.0
    start_y_m: 0.0
    start_z_m: 0.002
    start_qx: -0.002
    start_qy: 0.0
    start_qz: 0.962
    start_qw: -0.273
    # Reihenfolge wie in der validierten Waypoint-Datei:
    # elbow, shoulder_lift, shoulder_pan, wrist_1, wrist_2, wrist_3
    start_joints:
      - 0.7422645727740687
      - -0.9377638858607789
      - 0.9123795032501221
      - -1.3766160768321534
      - -1.5674694220172327
      - 0.1652015894651413
    move_to_start_duration_s: 4.0
    start_position_tolerance_m: 0.001
    start_orientation_tolerance_rad: 0.0523598776

    waypoint_yaml_file: /home/georgio/masterarbeit/radial_ik_waypoints_Setznest2.yaml
    max_waypoint_index: 2
    radial_speed_mps: 0.001
    endpoint_radial_tolerance_m: 0.0005
    cross_axis_tolerance_m: 0.0005
    orientation_tolerance_rad: 0.0523598776
    monotonic_noise_tolerance_m: 0.00010

    # Direkter ATI-Regler: +Fz_R ist die gemessene Kontaktreaktion;
    # -Z_R zeigt zur Oberfläche. Der UR-Force-Mode wird nicht verwendet.
    normal_force_n: 2.0
    approach_direction_sign: -1.0
    force_kp_mps_per_n: 0.00025
    force_filter_alpha: 0.20
    max_normal_velocity_mps: 0.0005
    contact_threshold_n: 0.5
    contact_persistence_s: 0.10
    contact_timeout_s: 8.0
    stabilisation_after_contact_s: 0.5
    baseline_duration_s: 1.0
    min_abs_contact_force_n: 0.5
    contact_loss_persistence_s: 0.20
    max_abs_normal_force_n: 6.0

    # Kurzhorizont-Trajektorien statt eines latchenden Velocity-Controllers:
    # bei Ausfall endet der letzte 40-ms-Schritt und der Roboter hält.
    velocity_command_topic: /forward_velocity_controller/commands
    control_rate_hz: 125.0
    command_horizon_s: 0.04
    joint_state_timeout_s: 0.10
    max_joint_velocity_radps: 0.15
    jacobian_damping: 0.02
    max_jacobian_condition: 250.0
    max_approach_displacement_m: 0.0030
    max_release_displacement_m: 0.0015
    release_velocity_mps: 0.0005
    release_force_threshold_n: 0.20
    release_clearance_m: 0.0005
    max_scan_duration_factor: 2.0

    # Software-biased ATI wrench from the bridge. The raw /ati/wrench_tcp
    # signal contains the stationary tool/gravity preload and must not be
    # used as the force-controller feedback signal.
    measurement_wrench_topic: /ati_ft_rtde_bridge/wrench_biased
    measurement_wrench_required: true
    measurement_wrench_timeout_s: 0.10
    measurement_wrench_expected_frame: ati_ur_aligned
    wrench_topic: /force_torque_sensor_broadcaster/wrench
    wrench_timeout_s: 0.25
    robot_program_running_topic: /io_and_status_controller/robot_program_running
    require_robot_program_running: true
    robot_dashboard_ip: 192.168.214.203
    robot_dashboard_port: 29999
    robot_dashboard_timeout_s: 0.25
    ati_bias_check_duration_s: 0.5
    ati_bias_max_abs_mean_force_n: 0.25

    abort_abs_dy_from_slide_start_m: 0.0015
    abort_orientation_rad: 0.1047197551
    abort_radial_undershoot_m: 0.0005
    abort_radial_overshoot_m: 0.0010
    flat_residual_peak_to_peak_limit_m: 0.0005
    mean_force_error_limit_n: 1.0

    sample_period_s: 0.008
    result_root: /home/georgio/masterarbeit/results/phase_b
    run_name: phase_b_Setznest2_ati_velocity_F2N_pilot_10
    bag_root: /home/georgio/masterarbeit/bags
    record_bag: true
    # DDS discovery on this PC can exceed two seconds under load.
    bag_start_wait_s: 8.0
    bag_qos_overrides_path: /home/georgio/hairpin_ws/src/hairpin_skills/config/rosbag_qos_overrides.yaml
    event_topic: /phase_b_ati_velocity/events
