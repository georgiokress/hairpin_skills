radial_sliding_test:
  ros__parameters:
    # Kontaktfreie 15-mm-Bahn am 2026-08-25 erfolgreich validiert.
    mode: slide
    free_space_validated: true

    sliding_frame: sliding_frame
    tcp_frame: tool0_controller
    publish_sliding_frame: false
    sliding_parent_frame: base
    sliding_tf_x_m: -0.228
    sliding_tf_y_m: -0.400
    sliding_tf_z_m: 0.038
    sliding_tf_qx: -0.002
    sliding_tf_qy: 0.0
    sliding_tf_qz: 0.971
    sliding_tf_qw: 0.240

    start_x_m: 0.0
    start_y_m: 0.0
    start_z_m: 0.002
    start_qx: -0.002
    start_qy: 0.0
    start_qz: 0.962
    start_qw: -0.273

    start_joints_calibrated: true
    start_joints:
      - 0.7422645727740687
      - -0.9377638858607789
      - 0.9123795032501221
      - -1.3766160768321534
      - -1.5674694220172327
      - 0.1652015894651413

    # Validierter WP6 bei +15 mm in x_R.
    slide_end_joints_calibrated: true
    slide_end_joints:
      - 0.758388520463029
      - -0.9471567308767167
      - 0.8787480417076973
      - -1.3833276258813008
      - -1.5674274969876563
      - 0.13159239788256571

    move_duration_s: 4.0
    slide_distance_m: 0.015
    radial_speed_mps: 0.004
    radial_tolerance_m: 0.0005
    # Fasenlauf: erwartete z_R-Absenkung ca. 2.7 mm; 4 mm erlaubt
    # die vollständige Auswertung und automatische Rückfahrt.
    cross_axis_tolerance_m: 0.004
    position_tolerance_m: 0.001
    orientation_tolerance_rad: 0.05236

    normal_force_n: -2.0
    contact_threshold_n: 0.5
    contact_persistence_s: 0.05
    contact_timeout_s: 5.0
    stabilisation_after_contact_s: 0.5
    speed_limit_z_mps: 0.001
    max_abs_normal_force_n: 6.0
    wrench_timeout_s: 0.25
    deviation_xy_m: 0.002
    deviation_z_m: 0.005
    deviation_angle_rad: 0.05
    damping_factor: 0.5
    gain_scaling: 0.3
    wrench_topic: /force_torque_sensor_broadcaster/wrench

    bag_root: /home/georgio/masterarbeit/bags
    bag_name: phase_c_Setznest2_internal_URFm2N_15mm_4mms_pilot_02
    bag_start_wait_s: 6.0
    tare_wait_s: 1.0
    tare_service: /io_and_status_controller/zero_ftsensor
