phase_b_force_source_diagnostic:
  ros__parameters:
    # Dieser Lauf diagnostiziert ausschliesslich, welcher F/T-Pfad den
    # UR-Force-Mode beeinflusst. Er validiert weder Phase B noch Phase C.
    phase_a_validated: true
    flat_surface_confirmed: true

    sliding_frame: sliding_frame
    tcp_frame: tool0_controller
    tf_timeout_s: 2.0
    # Der UR-Bringup publiziert base -> sliding_frame dauerhaft. Eine zweite
    # StaticTransformBroadcaster-Autoritaet im Versuchsknoten ist unzulaessig.
    publish_sliding_frame: false
    sliding_parent_frame: base
    sliding_tf_x_m: -0.228
    sliding_tf_y_m: -0.400
    sliding_tf_z_m: 0.038
    sliding_tf_qx: -0.002
    sliding_tf_qy: 0.0
    sliding_tf_qz: 0.971
    sliding_tf_qw: 0.240

    # Keine Startpose-Fahrt innerhalb dieses Knotens. Der Test wird erst nach
    # der validierten Phase-B-Startpose bei z_R=2 mm freigegeben. Mit 1.5 mm
    # Mindestabstand und 0.25 mm hartem Weglimit bleibt die Oberflaeche selbst
    # bei Ausschlag in -Z_R ausserhalb des Diagnosewegs.
    minimum_start_z_R_m: 0.0015

    # Begrenzter Nullkraft-Test. 0.2 mm/s * 0.5 s = 0.10 mm nomineller
    # Maximalweg; der geometrische Online-Abbruch liegt zusaetzlich bei 0.25 mm.
    # Erneute Richtungsdiagnose nach Beseitigung der doppelten TF-Autoritaet.
    # Kein Kontakt und keine Scanbewegung.
    normal_force_n: -2.0
    diagnostic_duration_s: 0.5
    speed_limit_z_mps: 0.0002
    max_diagnostic_displacement_m: 0.00025
    sample_period_s: 0.005
    max_abs_normal_force_n: 6.0
    deviation_xy_m: 0.002
    deviation_z_m: 0.005
    deviation_angle_rad: 0.05
    damping_factor: 0.5
    gain_scaling: 0.3

    wrench_topic: /force_torque_sensor_broadcaster/wrench
    # Exakt der software-gebiasste ATI-Wrench, den die Bridge über RTDE an UR
    # sendet. Der rohe RDT-Kanal ist nur Transport-/Diagnosequelle.
    measurement_wrench_topic: /ati_ft_rtde_bridge/wrench_biased
    measurement_wrench_required: true
    measurement_wrench_timeout_s: 0.25
    measurement_wrench_expected_frame: ati_ur_aligned
    ati_bias_ready_topic: /ati_ft_rtde_bridge/bias_ready
    ati_bias_ready_timeout_s: 10.0
    robot_program_running_topic: /io_and_status_controller/robot_program_running
    require_robot_program_running: true
    robot_dashboard_ip: 192.168.214.203
    robot_dashboard_port: 29999
    robot_dashboard_timeout_s: 0.25
    ati_bias_check_duration_s: 0.5
    ati_bias_max_abs_mean_force_n: 0.25

    result_root: /home/georgio/masterarbeit/results/phase_b_diagnostics
    run_name: phase_b_force_source_minus2n_direction_diagnostic_04
    bag_root: /home/georgio/masterarbeit/bags
    record_bag: true
    bag_start_wait_s: 6.0
    bag_qos_overrides_path: /home/georgio/hairpin_ws/src/hairpin_skills/config/rosbag_qos_overrides.yaml
    event_topic: /phase_b_force_source_diagnostic/events
