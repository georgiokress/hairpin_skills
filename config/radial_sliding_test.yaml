radial_sliding_test:
  ros__parameters:
    # First use "validate". Change to "slide" only after a passed free-space test.
    mode: slide
    free_space_validated: true

    sliding_frame: sliding_frame
    tcp_frame: tool0_controller
    publish_sliding_frame: true
    sliding_parent_frame: base
    sliding_tf_x_m: -0.22737
    sliding_tf_y_m: -0.40030
    sliding_tf_z_m: 0.03517
    sliding_tf_qx: -0.029727
    sliding_tf_qy: 0.047563
    sliding_tf_qz: -0.975264
    sliding_tf_qw: -0.213808

    start_x_m: 0.0
    start_y_m: 0.0
    start_z_m: 0.002
    start_qx: 0.056396
    start_qy: 0.030219
    start_qz: 0.280641
    start_qw: 0.957678

    start_joints_calibrated: true
    start_joints:
      - 1.4617331663714808
      - -1.1869505506804963
      - 0.8272621631622314
      - -1.889268537560934
      - -1.536943260823385
      - -0.22527915636171514

    # Insert a newly calibrated endpoint here.
    slide_end_joints_calibrated: true

    slide_end_joints:
      - 1.4642866293536585
      - -1.1886734527400513
      - 0.8195898532867432
      - -1.8900109730162562
      - -1.5365970770465296
      - -0.23298293748964483

    move_duration_s: 4.0
    slide_distance_m: 0.003
    radial_speed_mps: 0.001
    radial_tolerance_m: 0.0005
    cross_axis_tolerance_m: 0.0005
    position_tolerance_m: 0.001
    orientation_tolerance_rad: 0.05236

    normal_force_n: -5.0
    contact_threshold_n: 2.0
    contact_persistence_s: 0.05
    contact_timeout_s: 3.0
    stabilisation_after_contact_s: 0.5
    speed_limit_z_mps: 0.005
    max_abs_normal_force_n: 12.0
    wrench_timeout_s: 0.25
    deviation_xy_m: 0.002
    deviation_z_m: 0.005
    deviation_angle_rad: 0.05
    damping_factor: 0.5
    gain_scaling: 0.3
    wrench_topic: /force_torque_sensor_broadcaster/wrench

    bag_root: /home/georgio/masterarbeit/bags
    bag_name: radial_sliding_01
    bag_start_wait_s: 2.0
    tare_wait_s: 1.0
