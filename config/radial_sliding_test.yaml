radial_sliding_test:
  ros__parameters:
    # First use "validate". Change to "slide" only after a passed free-space test.
    mode: slide
    free_space_validated: true

    sliding_frame: sliding_frame
    tcp_frame: tool0_controller
    publish_sliding_frame: false
    sliding_parent_frame: base
    sliding_tf_x_m: -0.228
    sliding_tf_y_m: -0.400
    sliding_tf_z_m: 0.038
    sliding_tf_qx: -0.002
    sliding_tf_qy: 0.0
    sliding_tf_qz: 0.971
    sliding_tf_qw: 0.240

    start_x_m: 0.0
    start_y_m: 0.0
    start_z_m: 0.002
    start_qx: -0.002
    start_qy: 0.0
    start_qz: 0.962
    start_qw: -0.273

    start_joints_calibrated: true
    start_joints:
      - 0.7422645727740687
      - -0.9377638858607789
      - 0.9123795032501221
      - -1.3766160768321534
      - -1.5674694220172327
      - 0.1652015894651413

    # Insert a newly calibrated endpoint here.
    slide_end_joints_calibrated: true

    slide_end_joints:
      - 0.7483109359102661
      - -0.9412975815732083
      - 0.9011783834871441
      - -1.3791139433679538
      - -1.5674520077358982
      - 0.15399209461635568

    move_duration_s: 4.0
    slide_distance_m: 0.005
    radial_speed_mps: 0.001
    radial_tolerance_m: 0.0005
    cross_axis_tolerance_m: 0.0005
    position_tolerance_m: 0.001
    orientation_tolerance_rad: 0.05236

    # Kontrolllauf ausschließlich mit dem internen UR-F/T-Sensor.
    # -Z_R zeigt zur Oberfläche.
    normal_force_n: -2.0
    contact_threshold_n: 0.5
    contact_persistence_s: 0.05
    contact_timeout_s: 5.0
    stabilisation_after_contact_s: 0.5
    speed_limit_z_mps: 0.001
    max_abs_normal_force_n: 6.0
    wrench_timeout_s: 0.25
    deviation_xy_m: 0.002
    deviation_z_m: 0.005
    deviation_angle_rad: 0.05
    damping_factor: 0.5
    gain_scaling: 0.3
    wrench_topic: /force_torque_sensor_broadcaster/wrench

    bag_root: /home/georgio/masterarbeit/bags
    bag_name: phase_b_Setznest2_internal_URFm2N_pilot_01
    bag_start_wait_s: 6.0
    tare_wait_s: 1.0
    tare_service: /io_and_status_controller/zero_ftsensor
